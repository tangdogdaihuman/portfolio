name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Schema Source Check
        run: npm run test:schema

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: file:./ci-build.db
          DATABASE_AUTH_TOKEN: ""
          ADMIN_SECRET_KEY: ci-build-only-secret
          CRON_SECRET: ci-build-only-cron
          R2_ACCOUNT_ID: local
          R2_ACCESS_KEY_ID: local
          R2_SECRET_ACCESS_KEY: local
          R2_BUCKET_NAME: local
          R2_PUBLIC_URL: https://r2.local
          NEXT_PUBLIC_BASE_URL: http://localhost:3000

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e
