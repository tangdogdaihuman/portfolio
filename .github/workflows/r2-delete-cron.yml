name: R2 Delete Retry Cron

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cron endpoint
        env:
          CRON_ENDPOINT: ${{ secrets.CRON_ENDPOINT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_ENDPOINT" ] || [ -z "$CRON_SECRET" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::error::CRON_ENDPOINT or CRON_SECRET is not set; scheduled R2 cleanup cannot run."
              exit 1
            fi
            echo "CRON_ENDPOINT or CRON_SECRET is not set; skip."
            exit 0
          fi

          curl --fail --show-error --silent \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CRON_ENDPOINT"
